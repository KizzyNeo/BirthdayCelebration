<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabitha's Birthday Cake</title>
    <link rel="stylesheet" href="style.css" >
</head>
<body>
    <div class="container">
        <h1 class="text">Happy Birthday, Tabitha <img class="balloons" src="./images/—Pngtree—set of multicolored birthday balloons_9001438.png" /></h1>
        <div id="cake" class="cake">
            <div class="candle">
                <div id="flame" class="flame"></div>
                <div id="smoke" class="smoke-container"></div>
            </div>
        </div>
        <button id="startBtn">
            Click to Begin Celebration
        </button>
        <h2 id="status" class="text2">
          
        </h2>
    </div>
    <audio id="birthdayMusic" loop>
        <source src="./song/nastelbom-happy-birthday-495860.mp3" type="audio/mpeg">
    </audio>
    <script src="script.js"></script>
</body>
</html>
